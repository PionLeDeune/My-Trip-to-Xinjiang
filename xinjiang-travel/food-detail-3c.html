<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餐食详情</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<header>
  <div class="container">
    <h1>沿途餐食记录</h1>
    <p class="sub-desc">团餐/门店/外卖完整实拍与口味点评</p>
  </div>
</header>
<div class="container" style="margin-top:30px;">
  <a href="index.html" class="back-btn">← 返回首页</a>
  <div class="panel">
    <!--black smaller font saying D1 supper below-->
    <div class="tag-black" style="margin-top:10px;">D3 6.11 晚餐</div>
    <span id="food-tag" class="tag-green">团餐</span>
    <h2 class="detail-title" id="food-name" style="margin-top:10px;">布尔津 公路川味餐厅</h2>
    <h4 class="tag-black" style="margin-top:10px;">具体名字忘了</h4>
    <p class="desc-text" id="food-desc" style="margin:10px 0;">
      旁边有个小超市买了瓶沙棘汁

    </p>
    <h3>环境评价</h3>
    <p class="desc-text" id="food-env-eval">公路边的小馆子，写着川味馆子</p>
    <!--下面空两行-->
    <br><br>
    <h3>个人口味评价</h3>
    <p class="desc-text" id="food-taste-eval">猪臊味好浓，鱼也是刺又多又不好吃。就包菜和沙葱能吃。美其名曰“吃返内地口味”，实则都是拉完了。</p>
  </div>
</div>

<script type="module">
import { getUrlParam, getFoodTagClass, lazyLoadImg } from "./js/util.js";
import { foodList } from "./js/data.js";

const fid = getUrlParam("fid");
const food = foodList.find(item=>item.id == fid);

const tagDom = document.getElementById("food-tag");
tagDom.className = getFoodTagClass(food.type);
tagDom.innerText = food.day;

document.getElementById("food-name").innerText = food.title;
document.getElementById("food-desc").innerText = food.desc;
document.getElementById("food-env-eval").innerText = food.envEval || "暂无环境评价，可自行补充";
document.getElementById("food-taste-eval").innerText = food.tasteEval || "暂无口味评价，可自行补充口感、分量、推荐度文字";

// 菜品图片渲染
food.imgs.forEach(src=>{
  const img = document.createElement("img");
  img.src = src;
  document.getElementById("food-gallery").appendChild(img);
})
lazyLoadImg(document.querySelectorAll("img"));
</script>
</body>
</html>
