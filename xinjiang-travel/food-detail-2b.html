<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餐食详情</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<header>
  <div class="container">
    <h1>沿途餐食记录</h1>
    <p class="sub-desc">团餐/门店/外卖完整实拍与口味点评</p>
  </div>
</header>
<div class="container" style="margin-top:30px;">
  <a href="index.html" class="back-btn">← 返回首页</a>
  <div class="panel">
    <!--black smaller font saying D1 supper below-->
    <div class="tag-black" style="margin-top:10px;">D2 6.10 午餐</div>
    <span id="food-tag" class="tag-green">团餐</span>
    <h2 class="detail-title" id="food-name" style="margin-top:10px;">喀纳斯贾登峪游客中心美食城</h2>
    <h4 class="tag-black" style="margin-top:10px;">新疆特色菜&部分家常菜</h4>
    <p class="desc-text" id="food-desc" style="margin:10px 0;"></p>

    <h3>菜品实拍照片</h3>
    <div class="photo-gallery" id="food-gallery"></div>
    <br><br>
    <h3>环境评价</h3>
    <p class="desc-text" id="food-env-eval">待补充环境评价</p>
    <!--下面空两行-->
    <br><br>
    <h3>个人口味评价</h3>
    <p class="desc-text" id="food-taste-eval">待补充口味评价</p>
  </div>
</div>

<!-- 大图弹窗容器 -->
  <div class="img-modal">
  <span class="img-close">×</span>
  <img id="bigImg" src="" alt="大图预览">
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- 关键：添加 type="module" 才能使用 import -->
<script type="module">
import { hotelList } from "./js/data.js";

// 大图预览函数
const modal = document.querySelector('.img-modal');
const bigImg = document.getElementById('bigImg');
const closeBtn = document.querySelector('.img-close');

// 打开大图
window.openBigImg = function(src) {
  bigImg.src = src;
  modal.classList.add('show');
}
// 关闭大图
function closeModal() {
  modal.classList.remove('show');
}
closeBtn.onclick = closeModal;
// 点击黑色背景也能关闭
modal.onclick = (e) => {
  if(e.target === modal) closeModal();
}
// ESC键关闭
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
})

// 打印调试信息，F12控制台可查看
console.log("全部餐厅数据", hotelList);
const params = new URLSearchParams(location.search);
const hid = Number(params.get("fid"));
console.log("当前获取fid参数：", hid);

const currHotel = hotelList.find(h => h.id === hid);
console.log("匹配到的餐厅数据：", currHotel);

if (!currHotel) {
  document.querySelector(".container").innerHTML = `
    <div class="panel">
      <h2>未找到该餐厅，请检查链接fid参数</h2>
      <p>当前fid：${hid}</p>
      <a class="back-btn" href="index.html">返回首页</a>
    </div>
  `;
} else {
  // 填充文字
  const foodTitleLink = document.querySelector(".food-website");
  foodTitleLink.textContent = currHotel.name;
  foodTitleLink.href = currHotel.tripWebsite;
  foodTitleLink.target = "_blank";
  foodTitleLink.rel = "noopener noreferrer";

  document.querySelector(".food-score").textContent = currHotel.score.toFixed(2);
  document.querySelector(".food-comment").textContent = currHotel.comment;
  document.querySelector(".breakfast-comment").textContent = currHotel.breakfast;

  // 封面图
  const coverImg = document.querySelector(".food-cover");
  coverImg.src = currHotel.coverImg;
  coverImg.onerror = () => console.log("封面图片加载失败：", currHotel.coverImg);

  // 个人实拍图库
  const userWrap = document.querySelector(".user-gallery");
  if (currHotel.roomUser && currHotel.roomUser.length > 0) {
    userWrap.innerHTML = currHotel.roomUser.map(imgSrc => `
      <img loading="lazy" src="${imgSrc}" alt="本人实拍" onclick="openBigImg('${imgSrc}')" onerror="console.log('图缺失：${imgSrc}')">
    `).join("");
  } else {
    userWrap.innerHTML = "<p>不记得拍照了捏~</p>";
  }
  userWrap.style.marginBottom = "20px"; // 给“本人用餐实拍”部分增加底部间距
}
</script>
</body>
</html>
