<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店详情</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body>
<header>
  <div class="container">
    <h1>住宿详情</h1>
    <p class="sub-desc">全部7家住宿完整实拍与个人评价</p>
  </div>
</header>
<div class="container" style="margin-top:30px;">
  <a href="index.html" class="back-btn">← 返回首页</a>
  <div class="panel">
    <h2 class="detail-title" id="hotel-name">酒店名称</h2>
    <div id="hotel-score"></div>
    <p style="margin:8px 0 20px;color:#555;" id="hotel-area">所在地</p>

    <h3>酒店外观实拍</h3>
    <div class="photo-gallery" id="cover-gallery"></div>

    <h3>官方房型图库</h3>
    <div class="photo-gallery" id="official-gallery"></div>

    <h3>本人实拍房间照片</h3>
    <div class="photo-gallery" id="user-gallery"></div>

    <h3>个人住宿评价</h3>
    <p class="desc-text" id="hotel-comment"></p>
  </div>
</div>

<script type="module">
import { getUrlParam, renderScore, lazyLoadImg } from "./js/util.js";
import { hotelList } from "./js/data.js";

const hid = getUrlParam("hid");
const hotel = hotelList.find(item=>item.id == hid);

document.getElementById("hotel-name").innerText = hotel.name;
document.getElementById("hotel-area").innerText = `📍 ${hotel.area}`;
document.getElementById("hotel-score").innerHTML = renderScore(hotel.score);
document.getElementById("hotel-comment").innerText = hotel.comment;

// 外观图
const coverImg = document.createElement("img");
coverImg.src = hotel.coverImg;
document.getElementById("cover-gallery").appendChild(coverImg);

// 官方房间图
hotel.roomOfficial.forEach(src=>{
  const img = document.createElement("img");
  img.src = src;
  document.getElementById("official-gallery").appendChild(img);
})
// 个人实拍图
hotel.roomUser.forEach(src=>{
  const img = document.createElement("img");
  img.src = src;
  document.getElementById("user-gallery").appendChild(img);
})
lazyLoadImg(document.querySelectorAll("img"));
</script>
</body>
</html>
